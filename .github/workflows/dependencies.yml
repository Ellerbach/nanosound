name: Update nanoFramework dependencies

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: NuGet/setup-nuget@v2
      - name: Install nanoFramework MSBuild components
        shell: pwsh
        run: |
          $vsix = Join-Path $env:RUNNER_TEMP 'nanoframework.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'nanoframework-vsix'
          Invoke-WebRequest -Uri 'https://github.com/nanoframework/nf-Visual-Studio-extension/releases/download/v2022.14.3.3/nanoFramework.Tools.VS2022.Extension.vsix' -OutFile $vsix
          Expand-Archive -Path $vsix -DestinationPath $directory
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio MSBuild was not found.' }
          Copy-Item -Path (Join-Path $directory '$MSBuild\nanoFramework') -Destination (Join-Path $visualStudio 'MSBuild') -Recurse -Force
      - uses: nanoframework/nanodu@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          branchToPr: ${{ github.event.repository.default_branch }}
          stablePackages: true
          solutionsToCheck: nanoSound.sln